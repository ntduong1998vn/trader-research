name: Check Pine indicator logic

on:
  push:
    branches: [main]
    paths: ['pine/**', 'tests/**', 'package*.json', '.github/workflows/pine.yml']
  pull_request:
    branches: [main]
    paths: ['pine/**', 'tests/**', 'package*.json', '.github/workflows/pine.yml']

permissions:
  contents: read

jobs:
  pine-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
